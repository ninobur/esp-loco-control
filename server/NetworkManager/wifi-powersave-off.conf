# /etc/NetworkManager/conf.d/wifi-powersave-off.conf
#
# Disable Wi-Fi power save on ngr-pi, for every Wi-Fi connection, permanently.
#
# WHY THIS FILE EXISTS RATHER THAN A PER-CONNECTION PROPERTY
#
# The obvious fix is:
#     nmcli connection modify NGR 802-11-wireless.powersave 2
# That was run on 2026-08-30 and did not hold — the property read back
# "0 (default)" afterwards. A per-connection property also dies with the
# profile, and the NGR profile has already been deleted and recreated once
# (2026-08-30, to clear a half-created profile that was rejecting the PSK).
#
# This file applies to every Wi-Fi connection and survives profile deletion.
# The per-connection property is also set, as belt and braces; this file is
# what makes it durable.
#
# WHAT IT FIXES
#
# brcmfmac enables power save at every boot. From the 2026-09-01 boot log:
#     [   10.999348] brcmfmac: brcmf_cfg80211_set_power_mgmt: power save enabled
# A sleeping station stops answering inbound traffic while the Wi-Fi chip
# continues to answer ARP from its own firmware. The Pi then looks alive at
# layer 2 and dead at every layer above it: no ICMP, no SSH, no MQTT, no
# dashboard. That is the whole system down, because every locomotive and the
# console reach the broker by IP.
#
# HOW TO VERIFY — AND THE TRAP
#
#     sudo iw dev wlan0 get power_save     # must print: Power save: off
#
# nmcli showing "2 (disable)" is NOT proof; it reports intent, not driver
# state. Worse, `iw` was not installed on this Pi until 2026-09-01, so every
# verification attempt before that date failed with a shell error that was
# misread as evidence. Install it if it is ever missing:
#
#     sudo apt-get install -y iw
#
# Applied and verified 2026-09-01: on -> off across an `nmcli connection
# down NGR && up NGR` bounce.
[connection]
wifi.powersave = 2
